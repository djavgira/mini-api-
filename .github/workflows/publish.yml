name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

# One publish at a time; a newer commit supersedes a queued older one rather
# than racing it for the :latest tag.
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: djavgira/mini-api

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The composed image needs no build args beyond the commit stamp, but the
      # buildx cache keeps the Rust, Go and npm layers across runs.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.merged
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
