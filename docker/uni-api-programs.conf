[program:gateway]
command=/usr/bin/env PORT=8001 /usr/local/bin/uni-api-front
directory=/home
user=gateway
environment=HOME="/home/data",TMPDIR="/home/data",PATH="/usr/local/bin:/usr/bin:/bin"
autostart=true
autorestart=true
startsecs=3
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:analytics]
command=/usr/local/bin/analytics-api
directory=/usr/local/share/analytics-api
user=gateway
environment=HOME="/data",TMPDIR="/data",PATH="/usr/local/bin:/usr/bin:/bin"
autostart=true
autorestart=true
startsecs=2
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=10
autostart=true
autorestart=true
startsecs=2
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
