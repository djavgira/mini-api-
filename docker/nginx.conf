# Combined console + gateway site. Rendered by docker/entrypoint.sh.
#
# Routing contract:
#   /analytics/*        console analysis API (prefix stripped)
#   /v1/runtime-facts   machine ingestion, matched before the generic prefix
#   /v1/runtime-restore machine restore, matched before the generic prefix
#   /v1/*               uni-api gateway (chat, images, models, platform admin)
#   everything else     console SPA

upstream analytics_pool {
    server ${ANALYTICS_UPSTREAM_ADDRESS};
    keepalive 16;
}

upstream gateway_pool {
    server ${GATEWAY_UPSTREAM_ADDRESS};
    keepalive 32;
}

log_format console_proxy escape=json
    '{"ts":"$time_iso8601","request_id":"$http_x_console_request_id",'
    '"remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$uri","status":$status,"request_time":$request_time,'
    '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time","bytes":$body_bytes_sent}';

server {
    listen 8000 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    client_max_body_size 32m;

    access_log /dev/stdout console_proxy;
    error_log  /dev/stderr warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        add_header Content-Type application/json always;
        return 200 '{"status":"ok","app":"uni-api"}';
    }

    # Machine endpoints keep their path but must reach the analysis service,
    # which understands both the direct and the /analytics/ prefixed form.
    location ~ ^/analytics(/v1/runtime-(?:facts|restore)/.+)$ {
        proxy_pass ${ANALYTICS_UPSTREAM_SCHEME}://analytics_pool${ANALYTICS_UPSTREAM_PATH}$1;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        client_max_body_size 8m;
    }

    location /analytics/ {
        proxy_pass ${ANALYTICS_UPSTREAM_SCHEME}://analytics_pool${ANALYTICS_UPSTREAM_PATH}/;
        proxy_http_version 1.1;
        # $http_host keeps the port the browser used, so the analysis service
        # can tell that Origin matches Host whatever address the console was
        # opened on.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
    }

    # The gateway owns every /v1/ path. Streaming responses must not be
    # buffered, and long generations need generous read timeouts.
    location /v1/ {
        proxy_pass ${GATEWAY_UPSTREAM_SCHEME}://gateway_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        # The gateway reports large model catalogs and capability headers that
        # do not fit nginx's 8k default response-header buffer.
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        client_max_body_size 0;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
